<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Securely - UPI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        input:focus {
            outline: none;
        }
        .active-scale:active {
            transform: scale(0.95);
        }
        /* Smooth transition for bottom sheet */
        .bottom-sheet {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Hide scrollbar for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-900 md:bg-slate-200 flex justify-center items-center min-h-screen antialiased">

    <!-- Mobile Device Frame Container -->
    <div class="w-full max-w-md bg-slate-50 min-h-screen shadow-2xl relative flex flex-col justify-between rounded-none md:rounded-[40px] md:min-h-[850px] md:max-h-[880px] border border-gray-100 overflow-hidden">
        
        <!-- PAYMENT INTERFACE SCREEN -->
        <div id="paymentScreen" class="flex flex-col justify-between h-full flex-1">
            <!-- TOP APP BAR -->
            <header class="p-4 flex justify-between items-center bg-white border-b border-gray-100">
                <a href="index.html" class="w-10 h-10 flex items-center justify-center text-gray-700 rounded-full hover:bg-gray-50 active-scale transition-all">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <div class="flex flex-col items-center">
                    <span class="text-xs font-bold text-gray-400 tracking-wider uppercase">Send Money</span>
                </div>
                <button class="w-10 h-10 flex items-center justify-center text-gray-700 rounded-full hover:bg-gray-50 active-scale transition-all">
                    <i class="fa-solid fa-ellipsis-vertical text-lg"></i>
                </button>
            </header>

            <!-- MAIN BODY CONTENT -->
            <main class="flex-1 flex flex-col items-center pt-8 px-6 relative">
                
                <!-- Receiver Profile Header Card -->
                <div class="w-full bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col items-center relative">
                    <!-- Avatar -->
                    <div id="avatarBg" class="w-16 h-16 rounded-full text-white flex items-center justify-center text-xl font-bold shadow-inner transition-all duration-300 transform">
                        <span id="avatarInitials">AS</span>
                    </div>
                    
                    <!-- Editable Details -->
                    <div class="text-center mt-3 w-full">
                        <div class="flex items-center justify-center gap-1.5 px-4">
                            <input type="text" id="receiverName" value="Adarsh Shukla" class="font-bold text-xl text-gray-800 text-center bg-transparent w-full border-b border-transparent hover:border-gray-200 focus:border-blue-500 pb-0.5 transition-all truncate" placeholder="Recipient Name">
                            <i class="fa-solid fa-circle-check text-blue-500 text-base"></i>
                        </div>
                        <div class="flex items-center justify-center text-xs text-gray-400 font-medium mt-1">
                            <span class="bg-gray-100 px-2 py-0.5 rounded-md flex items-center gap-1">
                                <i class="fa-solid fa-at text-[10px]"></i>
                                <input type="text" id="receiverUpi" value="adarsh1207@nsdl" class="bg-transparent text-gray-600 font-bold w-36 border-b border-transparent focus:border-blue-400" placeholder="username@upi">
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Dynamic Amount Display Block -->
                <div id="amountWrapper" class="mt-10 mb-4 text-center transition-all duration-300 p-4 rounded-2xl w-full">
                    <div class="flex items-center justify-center text-gray-800 font-semibold text-5xl tracking-tight">
                        <span class="text-3xl font-medium text-gray-400 mr-1">₹</span>
                        <span id="amountDisplay" class="font-bold">0</span>
                    </div>
                    <!-- Hidden real input to maintain backend consistency -->
                    <input type="number" id="amountInput" value="0" class="hidden">
                    <p id="balanceWarning" class="text-xs text-red-500 font-semibold mt-2 opacity-0 transition-opacity">Insufficient account balance</p>
                </div>

                <!-- Contextual Note / Message Badge -->
                <div class="w-full max-w-[240px]">
                    <div class="flex items-center bg-white border border-gray-200 rounded-full px-4 py-2 shadow-sm focus-within:border-blue-500 transition-all">
                        <i class="fa-regular fa-comment-dots text-gray-400 mr-2"></i>
                        <input type="text" placeholder="Add a note (e.g., Dinner)" class="bg-transparent text-gray-700 text-xs font-medium w-full placeholder-gray-400">
                    </div>
                </div>

            </main>

            <!-- FOOTER & VIRTUAL KEYBOARD SECTION -->
            <footer class="bg-white border-t border-gray-100 rounded-t-[32px] shadow-[0_-8px_30px_rgb(0,0,0,0.04)] px-6 pt-4 pb-6 w-full flex flex-col gap-4">
                
                <!-- CURRENT ACC SELECTOR BAR -->
                <div class="w-full flex justify-center">
                    <div onclick="openBankDropdown(event)" class="w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 flex items-center justify-between cursor-pointer transition-all active-scale select-none">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
                                <i class="fa-solid fa-building-columns text-sm"></i>
                            </div>
                            <div class="flex flex-col items-start">
                                <span class="text-[10px] uppercase font-bold text-gray-400 tracking-wider leading-none">Paying From</span>
                                <span id="selectedBankName" class="text-xs font-extrabold text-slate-800 mt-1">Loading Account...</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-up text-xs text-gray-400"></i>
                    </div>
                </div>

                <!-- COMPACT CUSTOM MOBILE NUMPAD -->
                <div class="grid grid-cols-3 gap-y-2 gap-x-4 my-2 text-center select-none">
                    <button onclick="pressKey('1')" class="py-3 text-xl font-bold text-slate-700 rounded-lg active:bg-slate-100 active-scale transition-all">1</button>
                    <button onclick="pressKey('2')" class="py-3 text-xl font-bold text-slate-700 rounded-lg active:bg-slate-100 active-scale transition-all">2</button>
                    <button onclick="pressKey('3')" class="py-3 text-xl font-bold text-slate-700 rounded-lg active:bg-slate-100 active-scale transition-all">3</button>
                    <button onclick="pressKey('4')" class="py-3 text-xl font-bold text-slate-700 rounded-lg active:bg-slate-100 active-scale transition-all">4</button>
                    <button onclick="pressKey('5')" class="py-3 text-xl font-bold text-slate-700 rounded-lg active:bg-slate-100 active-scale transition-all">5</button>
                    <button onclick="pressKey('6')" class="py-3 text-xl font-bold text-slate-700 rounded-lg active:bg-slate-100 active-scale transition-all">6</button>
                    <button onclick="pressKey('7')" class="py-3 text-xl font-bold text-slate-700 rounded-lg active:bg-slate-100 active-scale transition-all">7</button>
                    <button onclick="pressKey('8')" class="py-3 text-xl font-bold text-slate-700 rounded-lg active:bg-slate-100 active-scale transition-all">8</button>
                    <button onclick="pressKey('9')" class="py-3 text-xl font-bold text-slate-700 rounded-lg active:bg-slate-100 active-scale transition-all">9</button>
                    <button onclick="pressKey('.')" class="py-3 text-xl font-bold text-slate-700 rounded-lg active:bg-slate-100 active-scale transition-all">.</button>
                    <button onclick="pressKey('0')" class="py-3 text-xl font-bold text-slate-700 rounded-lg active:bg-slate-100 active-scale transition-all">0</button>
                    <button onclick="pressKey('back')" class="py-3 text-lg font-bold text-slate-500 rounded-lg active:bg-slate-100 active-scale transition-all flex items-center justify-center">
                        <i class="fa-solid fa-delete-left"></i>
                    </button>
                </div>

                <!-- PRIMARY PAY BUTTON -->
                <button onclick="handlePayment()" class="w-full bg-[#0a52f6] text-white font-bold text-base py-4 rounded-xl shadow-lg shadow-blue-600/20 hover:bg-blue-700 active-scale transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-shield-halved text-sm"></i>
                    <span>Pay Securely</span>
                </button>

                <!-- UPI Brand Badge -->
                <div class="flex items-center justify-center gap-1 opacity-40 grayscale hover:grayscale-0 transition-all mt-1">
                    <span class="text-[9px] font-bold tracking-widest text-slate-500 uppercase">Secured by</span>
                    <div class="flex items-center font-black text-xs italic tracking-tighter">
                        <span class="text-blue-600">U</span>
                        <span class="text-orange-500">P</span>
                        <span class="text-emerald-600">I</span>
                    </div>
                </div>
            </footer>
        </div>

        <!-- SUCCESS RECEIPT SCREEN (Hidden by Default) -->
        <div id="receiptScreen" class="hidden flex-1 flex flex-col justify-between bg-white h-full p-6 overflow-y-auto">
            <div class="flex flex-col items-center pt-8 flex-1 justify-center">
                <!-- Checkmark Icon -->
                <div class="w-20 h-20 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/20 mb-4 animate-bounce">
                    <i class="fa-solid fa-check text-white text-4xl"></i>
                </div>
                
                <h2 class="text-xl font-bold text-slate-800 mb-8">Successful transfer</h2>

                <!-- Receipt Table -->
                <div class="w-full space-y-4 text-sm text-slate-600 px-2 max-w-sm">
                    <div class="flex justify-between items-start py-1">
                        <span class="text-slate-400 font-medium">Recipient Name</span>
                        <span id="receiptName" class="font-bold text-slate-800 text-right">---</span>
                    </div>
                    <div class="flex justify-between items-start py-1">
                        <span class="text-slate-400 font-medium">UPI ID / Acc</span>
                        <span id="receiptAccount" class="font-bold text-slate-800 text-right">---</span>
                    </div>
                    <div class="flex justify-between items-start py-1">
                        <span class="text-slate-400 font-medium">Date-Time</span>
                        <span id="receiptDateTime" class="font-bold text-slate-800 text-right">---</span>
                    </div>
                    <div class="flex justify-between items-start py-1">
                        <span class="text-slate-400 font-medium">Reference No.</span>
                        <span id="receiptRefNo" class="font-bold text-slate-800 text-right">---</span>
                    </div>
                    
                    <hr class="border-gray-100 my-2">

                    <div class="flex justify-between items-center py-1">
                        <span class="text-slate-400 font-medium">Amount</span>
                        <span id="receiptAmount" class="font-bold text-slate-800">₹0.00</span>
                    </div>
                    <div class="flex justify-between items-center py-1">
                        <span class="text-slate-400 font-medium">Fee</span>
                        <span class="font-bold text-slate-800">₹0.00</span>
                    </div>
                    
                    <hr class="border-dashed border-gray-200 my-2">

                    <div class="flex justify-between items-center py-1 text-base">
                        <span class="font-bold text-slate-800">Total Amount</span>
                        <span id="receiptTotal" class="font-black text-slate-900 text-lg">₹0.00</span>
                    </div>
                </div>
            </div>

            <!-- Done Button to Dismiss -->
            <div class="mt-8">
                <button onclick="dismissReceipt()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-xl transition-all active-scale">
                    Done
                </button>
            </div>
        </div>

        <!-- MOBILE STYLE BOTTOM SHEET DROPDOWN OVERLAY -->
        <div id="dropdownOverlay" onclick="closeBankDropdown()" class="hidden fixed inset-0 bg-black/40 z-40 transition-opacity duration-300 opacity-0"></div>
        
        <!-- Bottom Sheet Body -->
        <div id="bankDropdownMenu" class="bottom-sheet fixed md:absolute bottom-0 left-0 right-0 max-w-md mx-auto bg-white rounded-t-[32px] shadow-2xl z-50 transform translate-y-full border-t border-gray-100 overflow-hidden">
            <div class="w-12 h-1 bg-gray-200 rounded-full mx-auto my-3"></div>
            <div class="px-6 pb-2 flex justify-between items-center">
                <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider">Choose Bank Account</h3>
                <button onclick="closeBankDropdown()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="bankListContainer" class="max-h-64 overflow-y-auto px-4 pb-6 no-scrollbar">
                <!-- Dynamic bank rows will mount here -->
            </div>
        </div>

    </div>

    <!-- AUDIO ELEMENT: success.mp3 (place the file in the same folder) -->
    <audio id="successAudio" src="https://www.image2url.com/r2/default/audio/1780748863455-197ee552-4642-42c9-9893-a97054543876.mp3" preload="auto"></audio>

    <!-- CODE LOGIC -->
    <script>
        // 1. AVATAR CONFIGS
        const nameInput = document.getElementById('receiverName');
        const receiverUpi = document.getElementById('receiverUpi');
        const avatarInitials = document.getElementById('avatarInitials');
        const avatarBg = document.getElementById('avatarBg');
        const colors = ['bg-indigo-500', 'bg-emerald-500', 'bg-purple-500', 'bg-blue-500', 'bg-amber-500', 'bg-rose-500'];

        // UPI providers list for random generation
        const upiProviders = ['@paytm', '@googlepay', '@phonepe', '@amazonpay', '@upi', '@nsdl', '@okhdfc', '@axis', '@sbi', '@icici'];

        function generateUPIFromName(name) {
            if (!name || name.trim() === '') return 'user@upi';
            
            // Clean the name: lowercase, remove special chars, replace spaces with dots
            let cleanName = name.toLowerCase().trim().replace(/[^a-z0-9\s]/g, '');
            let parts = cleanName.split(/\s+/);
            
            let base = '';
            if (parts.length === 1) {
                // Single name: take first 6 chars + random number
                base = parts[0].substring(0, 6);
                if (base.length < 3) base = base + 'user';
            } else if (parts.length === 2) {
                // Two names: first name + last name initial or full
                base = parts[0].substring(0, 4) + parts[1].substring(0, 2);
            } else {
                // More than 2 names: first name + middle initial + last name initial
                base = parts[0].substring(0, 3) + parts[1].charAt(0) + parts[parts.length - 1].charAt(0);
            }
            
            // Add random numbers at the end (2-4 digits)
            const randomNum = Math.floor(100 + Math.random() * 900);
            base = base + randomNum;
            
            // Pick random UPI provider
            const provider = upiProviders[Math.floor(Math.random() * upiProviders.length)];
            
            return base + provider;
        }

        function updateAvatarAndUPI() {
            const name = nameInput.value.trim();
            
            // Update Avatar
            if (name) {
                const words = name.split(" ");
                let initials = words[0].charAt(0).toUpperCase();
                if (words.length > 1 && words[1].length > 0) {
                    initials += words[1].charAt(0).toUpperCase();
                }
                avatarInitials.innerText = initials;
                const colorIdx = name.length % colors.length;
                avatarBg.className = `w-16 h-16 rounded-full text-white flex items-center justify-center text-xl font-bold shadow-md transition-all duration-300 ${colors[colorIdx]}`;
            } else {
                avatarInitials.innerText = "??";
                avatarBg.className = `w-16 h-16 rounded-full text-white flex items-center justify-center text-xl font-bold shadow-md transition-all duration-300 bg-slate-400`;
            }
            
            // Generate and update UPI ID based on name
            const newUpi = generateUPIFromName(name);
            receiverUpi.value = newUpi;
        }

        nameInput.addEventListener('input', updateAvatarAndUPI);

        // 2. DATA MANAGEMENT
        const dropdownMenu = document.getElementById('bankDropdownMenu');
        const dropdownOverlay = document.getElementById('dropdownOverlay');
        const bankListContainer = document.getElementById('bankListContainer');
        const selectedBankName = document.getElementById('selectedBankName');
        const amountDisplay = document.getElementById('amountDisplay');
        const amountInput = document.getElementById('amountInput');
        const amountWrapper = document.getElementById('amountWrapper');
        const balanceWarning = document.getElementById('balanceWarning');
        
        // Screens
        const paymentScreen = document.getElementById('paymentScreen');
        const receiptScreen = document.getElementById('receiptScreen');

        // Receipt Fields
        const receiptName = document.getElementById('receiptName');
        const receiptAccount = document.getElementById('receiptAccount');
        const receiptDateTime = document.getElementById('receiptDateTime');
        const receiptRefNo = document.getElementById('receiptRefNo');
        const receiptAmount = document.getElementById('receiptAmount');
        const receiptTotal = document.getElementById('receiptTotal');
        
        let currentSelectedBank = null; 
        let currentAmountString = "0";

        window.addEventListener('DOMContentLoaded', () => {
            initializeDefaultDataIfEmpty();
            loadActiveBankSelection();
            updateAvatarAndUPI(); // Initialize UPI on load
        });

        function initializeDefaultDataIfEmpty() {
            if (!localStorage.getItem('savedUserBanks')) {
                const dummyBanks = [
                    { name: "CANARA BANK", account: "6954", balance: 25000.00 },
                    { name: "STATE BANK OF INDIA", account: "1122", balance: 4500.50 },
                    { name: "HDFC BANK LTD", account: "8890", balance: 1200.00 }
                ];
                localStorage.setItem('savedUserBanks', JSON.stringify(dummyBanks));
            }
        }

        function loadActiveBankSelection() {
            const savedBanks = JSON.parse(localStorage.getItem('savedUserBanks'));
            if (savedBanks && savedBanks.length > 0) {
                currentSelectedBank = savedBanks[0];
                selectedBankName.innerText = `${currentSelectedBank.name} •• ${currentSelectedBank.account}`;
            }
        }

        // 3. NUMPAD INTERACTION & REAL-TIME VALIDATION
        function pressKey(key) {
            if (key === 'back') {
                currentAmountString = currentAmountString.slice(0, -1);
                if (currentAmountString === "" || currentAmountString === "-") currentAmountString = "0";
            } else if (key === '.') {
                if (!currentAmountString.includes('.')) {
                    currentAmountString += '.';
                }
            } else {
                if (currentAmountString === "0") {
                    currentAmountString = key;
                } else {
                    // Restrict to max 2 decimal spaces
                    if (currentAmountString.includes('.')) {
                        const decimals = currentAmountString.split('.')[1];
                        if (decimals.length >= 2) return;
                    }
                    // Avoid abnormally high numbers for UI safety
                    if (parseFloat(currentAmountString + key) > 1000000) return;
                    currentAmountString += key;
                }
            }
            
            // Sync states
            amountDisplay.innerText = currentAmountString;
            amountInput.value = parseFloat(currentAmountString) || 0;
            validateLiveBalance();
        }

        function validateLiveBalance() {
            const amt = parseFloat(amountInput.value);
            if (currentSelectedBank && amt > currentSelectedBank.balance) {
                amountWrapper.classList.add('bg-red-50');
                balanceWarning.classList.remove('opacity-0');
            } else {
                amountWrapper.classList.remove('bg-red-50');
                balanceWarning.classList.add('opacity-0');
            }
        }

        // 4. BOTTOM SHEET ANIMATION CONTROL
        function openBankDropdown(e) {
            e.stopPropagation();
            dropdownOverlay.classList.remove('hidden');
            setTimeout(() => dropdownOverlay.classList.add('opacity-100'), 10);
            dropdownMenu.classList.remove('translate-y-full');
            renderDropdownList();
        }

        function closeBankDropdown() {
            dropdownOverlay.classList.remove('opacity-100');
            dropdownMenu.classList.add('translate-y-full');
            setTimeout(() => dropdownOverlay.classList.add('hidden'), 300);
        }

        function renderDropdownList() {
            const savedBanks = JSON.parse(localStorage.getItem('savedUserBanks'));
            bankListContainer.innerHTML = ""; 

            if (savedBanks && savedBanks.length > 0) {
                savedBanks.forEach((bank) => {
                    const isSelected = currentSelectedBank && currentSelectedBank.account === bank.account;
                    const row = document.createElement('div');
                    row.className = `flex justify-between items-center px-4 py-3.5 my-1.5 rounded-xl border transition-all cursor-pointer active:bg-slate-50 ${isSelected ? 'border-blue-500 bg-blue-50/40' : 'border-gray-100 bg-slate-50/50'}`;
                    row.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full ${isSelected ? 'bg-blue-500 text-white' : 'bg-white border text-gray-500'} flex items-center justify-center">
                                <i class="fa-solid fa-building-columns text-sm"></i>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-xs font-black text-slate-800">${bank.name} •• ${bank.account}</span>
                                <span class="text-[11px] font-bold text-slate-400 mt-0.5">Available Balance: ₹${Number(bank.balance).toLocaleString('en-IN', {minimumFractionDigits: 2})}</span>
                            </div>
                        </div>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-blue-500"></i>' : ''}
                    `;
                    row.onclick = () => {
                        currentSelectedBank = bank;
                        selectedBankName.innerText = `${bank.name} •• ${bank.account}`;
                        closeBankDropdown();
                        validateLiveBalance();
                    };
                    bankListContainer.appendChild(row);
                });
            }
        }

        // 5. TRANSACTION TRIGGER & RECEIPT GENERATOR + SOUND
        function handlePayment() {
            const amount = parseFloat(amountInput.value);
            const receiver = nameInput.value.trim();
            const upiId = receiverUpi.value.trim();

            if (!amount || amount <= 0) {
                alert("Please input a valid amount greater than ₹0");
                return;
            }
            if (!currentSelectedBank) {
                alert("No bank records available.");
                return;
            }

            let savedBanks = JSON.parse(localStorage.getItem('savedUserBanks'));
            let bankIndex = savedBanks.findIndex(b => b.account === currentSelectedBank.account && b.name === currentSelectedBank.name);

            if (bankIndex === -1) {
                alert("Selected account data trace missing.");
                return;
            }

            let activeBankRecord = savedBanks[bankIndex];

            if (activeBankRecord.balance < amount) {
                alert(`Transaction Failed!\nInsufficient Funds inside chosen bank.`);
                return;
            }

            // Execute deduction logic safely
            activeBankRecord.balance -= amount;
            savedBanks[bankIndex] = activeBankRecord;
            localStorage.setItem('savedUserBanks', JSON.stringify(savedBanks));
            
            currentSelectedBank = activeBankRecord;

            // Generate Dynamic Data for Receipt
            const now = new Date();
            const formattedDate = now.toLocaleDateString('en-GB') + ' ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            const randomRef = Math.floor(100000000000 + Math.random() * 900000000000);

            // Update Receipt UI fields
            receiptName.innerText = receiver || "Unknown Recipient";
            receiptAccount.innerText = upiId || "---";
            receiptDateTime.innerText = formattedDate;
            receiptRefNo.innerText = randomRef;
            receiptAmount.innerText = `₹${amount.toFixed(2)}`;
            receiptTotal.innerText = `₹${amount.toFixed(2)}`;

            // Play success sound
            const audio = document.getElementById('successAudio');
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.warn("Audio play failed:", e));
            }

            // Log transaction to history
            logTransaction(receiver, upiId, amount, formattedDate, randomRef, 'success', currentSelectedBank.name);

            // Switch Screen View
            paymentScreen.classList.add('hidden');
            receiptScreen.classList.remove('hidden');
        }

        // 6. DISMISS RECEIPT PAGE
        function dismissReceipt() {
            currentAmountString = "0";
            amountDisplay.innerText = "0";
            amountInput.value = 0;
            validateLiveBalance();

            receiptScreen.classList.add('hidden');
            paymentScreen.classList.remove('hidden');
        }

        // 7. TRANSACTION HISTORY LOGGER
        function logTransaction(name, upi, amount, date, ref, status, bankName) {
            let history = JSON.parse(localStorage.getItem('upi_tx_history')) || [];
            const newTx = {
                name: name || "Unknown",
                upi: upi || "---",
                amount: amount,
                date: date,
                ref: ref,
                status: status,
                bank: bankName
            };
            history.unshift(newTx); 
            localStorage.setItem('upi_tx_history', JSON.stringify(history));
        }
    </script>
</body>
</html>
